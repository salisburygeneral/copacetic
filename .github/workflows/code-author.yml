name: code-author

# The fourth stage of the factory: writes the software that makes the accepted acceptance
# tests pass, and keeps it in step with review feedback.

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: code-author
  cancel-in-progress: false

jobs:
  code-author:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Install XcodeGen
        run: brew install xcodegen

      # Runners have no git identity configured, so `git commit` fails without this.
      # 41898282 is the github-actions[bot] account ID; GitHub's <id>+<login>@noreply
      # address form is what attributes the commit to that account.
      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Run the agent
        env:
          BUNDLE_ID: ${{ secrets.APP_BUNDLE_ID }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          claude \
            --model claude-opus-5 \
            --dangerously-skip-permissions \
            -p "$(cat factory/agents/code-author/prompt.md)"
