name: code-reviewer

# The fifth stage of the factory: reviews the software against the accepted tests it was
# built to satisfy, and accepts the code that is right.

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: code-reviewer
  cancel-in-progress: false

jobs:
  code-reviewer:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Run the agent
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          claude \
            --model claude-opus-5 \
            --dangerously-skip-permissions \
            -p "$(cat factory/agents/code-reviewer/prompt.md)"
