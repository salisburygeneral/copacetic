name: code-reviewer

# The fifth stage of the factory: reviews the software against the accepted tests it was
# built to satisfy, and accepts the code that is right.

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: code-reviewer
  cancel-in-progress: false

jobs:
  code-reviewer:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - uses: actions/create-github-app-token@v2
        id: token
        with:
          app-id: ${{ secrets.CODE_REVIEWER_APP_ID }}
          private-key: ${{ secrets.CODE_REVIEWER_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v4
        with:
          token: ${{ steps.token.outputs.token }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Run the agent
        env:
          BUNDLE_ID: ${{ secrets.APP_BUNDLE_ID }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GH_TOKEN: ${{ steps.token.outputs.token }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          claude \
            --model claude-opus-5 \
            --dangerously-skip-permissions \
            -p "$(cat factory/agents/code-reviewer/prompt.md)"
