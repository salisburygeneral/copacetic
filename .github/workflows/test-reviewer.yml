name: test-reviewer

# The third stage of the factory: reviews acceptance tests against the requirements they
# came from, and accepts the ones the rest of the factory can build against.

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-reviewer
  cancel-in-progress: false

jobs:
  test-reviewer:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - uses: actions/create-github-app-token@v2
        id: token
        with:
          app-id: ${{ secrets.TEST_REVIEWER_APP_ID }}
          private-key: ${{ secrets.TEST_REVIEWER_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v4
        with:
          token: ${{ steps.token.outputs.token }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Run the agent
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          claude \
            --model claude-opus-5 \
            --dangerously-skip-permissions \
            -p "$(cat factory/agents/test-reviewer/prompt.md)"
