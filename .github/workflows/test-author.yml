name: test-author

# The second stage of the factory: turns accepted requirements into acceptance tests,
# and keeps those tests in step with review feedback.

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-author
  cancel-in-progress: false

jobs:
  test-author:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - uses: actions/create-github-app-token@v2
        id: token
        with:
          app-id: ${{ secrets.TEST_AUTHOR_APP_ID }}
          private-key: ${{ secrets.TEST_AUTHOR_APP_PRIVATE_KEY }}

      # Checkout persists this token as the push credential; without it the agent
      # comments as the app but pushes as github-actions[bot].
      - uses: actions/checkout@v4
        with:
          token: ${{ steps.token.outputs.token }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      # Runners have no git identity configured, so `git commit` fails without this.
      # GitHub's <id>+<login>@noreply address form is what attributes the commit to the
      # app's bot account, and that account ID is only readable from the account itself.
      - name: Configure git identity
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          slug='${{ steps.token.outputs.app-slug }}'
          id=$(gh api "/users/$slug%5Bbot%5D" --jq .id)
          git config user.name "$slug[bot]"
          git config user.email "$id+$slug[bot]@users.noreply.github.com"

      - name: Run the agent
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          claude \
            --model claude-opus-5 \
            --dangerously-skip-permissions \
            -p "$(cat factory/agents/test-author/prompt.md)"
