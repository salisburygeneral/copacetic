name: Copacetic
options:
  deploymentTarget:
    iOS: "26.0"
packages:
  Copacetic:
    path: ..
targets:
  CopaceticApp:
    type: application
    platform: iOS
    sources:
      - Sources
      - Assets.xcassets
    dependencies:
      - package: Copacetic
        product: Copacetic
    settings:
      base:
        PRODUCT_NAME: Copacetic
        PRODUCT_MODULE_NAME: CopaceticApp
        PRODUCT_BUNDLE_IDENTIFIER: ${BUNDLE_ID}
        DEVELOPMENT_TEAM: ${TEAM_ID}
        INFOPLIST_FILE: Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
schemes:
  Copacetic:
    build:
      targets:
        CopaceticApp: all
